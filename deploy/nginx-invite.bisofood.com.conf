# /etc/nginx/sites-available/invite.bisofood.com
#
# - SPA Vite servie statiquement depuis /var/www/bisoinvit/web
# - API Node Express derrière /api/ (port 4000 sur localhost)
# - /uploads/ proxifiés (photos couples, etc.)
# - Certbot ajoutera/managera la partie HTTPS automatiquement
#
# Activation :
#   sudo ln -s /etc/nginx/sites-available/invite.bisofood.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d invite.bisofood.com

# Rate limit pour les routes d'authentification (anti brute-force)
limit_req_zone $binary_remote_addr zone=bisoinvit_login:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name invite.bisofood.com;

    # certbot remplira ce bloc avec la redirection 301 → HTTPS
    # En attendant, on sert l'app en HTTP

    root /var/www/bisoinvit/web;
    index index.html;

    # Logs dédiés
    access_log /var/log/nginx/invite.bisofood.com.access.log;
    error_log  /var/log/nginx/invite.bisofood.com.error.log;

    # Tailles
    client_max_body_size 20M;
    client_body_timeout 60s;

    # Sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/xml application/x-font-ttf font/woff font/woff2;

    # === API Express (Node) ===
    # ^~ : priorité sur la regex \.(jpg|png|...)$ ci-dessous
    # (sinon /api/.../export.jpg serait servi en statique → 404)
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300s;       # PDF bulk : Puppeteer peut être long
        proxy_send_timeout 300s;
        proxy_request_buffering off;   # streaming upload CSV
        proxy_buffering off;           # streaming download ZIP
    }

    # === Rate limit ciblé sur le login ===
    location = /api/auth/login {
        limit_req zone=bisoinvit_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/auth/controller/login {
        limit_req zone=bisoinvit_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === Fichiers uploadés (photos couple) ===
    # ^~ : priorité sur la regex \.(jpg|jpeg|...)$ ci-dessous
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        access_log off;
    }

    # === Assets buildés Vite (cache fort) ===
    location ~* \.(?:js|mjs|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # === SPA fallback (React Router) ===
    location / {
        try_files $uri $uri/ /index.html;
    }
}
